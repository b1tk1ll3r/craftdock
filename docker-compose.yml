services:
  craftdock:
    # Fertiges Image aus der GitHub Container Registry – oder lokal bauen mit `build: .`
    image: ghcr.io/b1tk1ll3r/craftdock:latest
    # build: .
    container_name: craftdock
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CRAFTDOCK_USER: admin
      CRAFTDOCK_PASSWORD: ${CRAFTDOCK_PASSWORD:?Bitte CRAFTDOCK_PASSWORD in .env setzen}
      TZ: Europe/Berlin
      # Neue Minecraft-Server landen im selben Netzwerk – so kann CraftDock sie
      # direkt anpingen (Live-Status, Spielerzahlen, Version, MOTD).
      CRAFTDOCK_NETWORK: minecraft
      # Optional: globaler CurseForge-API-Key für CurseForge-Modpacks
      # ($ im Key in der .env als $$ schreiben)
      # CRAFTDOCK_CF_API_KEY: ${CRAFTDOCK_CF_API_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - craftdock-data:/data          # Einstellungen der öffentlichen Seite + Spielerverlauf
    extra_hosts:
      # Fallback für Server außerhalb des Netzwerks: Ping über den veröffentlichten Host-Port
      - "host.docker.internal:host-gateway"
    networks:
      - minecraft

volumes:
  craftdock-data:

networks:
  minecraft:
    name: minecraft
