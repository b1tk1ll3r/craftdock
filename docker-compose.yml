services:
  craftdock:
    # Fertiges Image aus der GitHub Container Registry – oder lokal bauen mit `build: .`
    image: ghcr.io/b1tk1ll3r/craftdock:latest
    # build: .
    container_name: craftdock
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Erster Administrator – nur beim allerersten Start verwendet, danach
      # wird das Passwort in der Oberfläche geändert (Konto → Passwort, 2FA).
      CRAFTDOCK_USER: admin
      CRAFTDOCK_PASSWORD: ${CRAFTDOCK_PASSWORD:?Bitte CRAFTDOCK_PASSWORD in .env setzen}
      # Passwort/2FA des Administrators aus der .env zurücksetzen (danach entfernen):
      # CRAFTDOCK_RESET_ADMIN: "1"
      # Hinter einem Reverse-Proxy (Traefik, Caddy, nginx) dessen Netz eintragen,
      # damit echte Client-IPs und HTTPS erkannt werden:
      # CRAFTDOCK_TRUSTED_PROXIES: 172.16.0.0/12
      # Prometheus-Metriken unter /metrics (Bearer-Token):
      # CRAFTDOCK_METRICS_TOKEN: ${CRAFTDOCK_METRICS_TOKEN}
      TZ: Europe/Berlin
      # Neue Minecraft-Server landen im selben Netzwerk – so kann CraftDock sie
      # direkt anpingen (Live-Status, Spielerzahlen, Version, MOTD).
      CRAFTDOCK_NETWORK: minecraft
      # Optional: globaler CurseForge-API-Key für CurseForge-Modpacks
      # ($ im Key in der .env als $$ schreiben)
      # CRAFTDOCK_CF_API_KEY: ${CRAFTDOCK_CF_API_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - craftdock-data:/data          # Benutzer, Rollen, Einstellungen, Alarme, Server-Konfigurationen, Statistik
    extra_hosts:
      # Fallback für Server außerhalb des Netzwerks: Ping über den veröffentlichten Host-Port
      - "host.docker.internal:host-gateway"
    networks:
      - minecraft

volumes:
  craftdock-data:

networks:
  minecraft:
    name: minecraft
